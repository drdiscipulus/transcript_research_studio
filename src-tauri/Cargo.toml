[package]
name = "transcript_research_studio"
version = "1.0.0-beta.2"
description = "Desktop shell for Transcript Research Studio"
authors = ["Jens Schüler"]
license = "GPL-3.0-or-later"
repository = "https://github.com/drdiscipulus/transcript-research-studio"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
rand = "0.8"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.11.5", features = ["protocol-asset"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
